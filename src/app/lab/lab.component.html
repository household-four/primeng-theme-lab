<p-toolbar>
    <ng-template #start>
        <p-button icon="pi pi-plus" class="mr-2" text severity="secondary" />
        <p-button icon="pi pi-upload" class="mr-2" text severity="secondary" (click)="fileInput.click()" />
        <input #fileInput type="file" accept=".ts" style="display: none;" (change)="handleFileInput($event)" />
        <p-button icon="pi pi-file-export" text severity="secondary" (click)="exportTheme()" />
    </ng-template>
    <ng-template #end>
        <p-button [icon]="modeIcon" class="mr-2" text severity="secondary" (click)="toggleDarkMode()" />
        <p-button [icon]="modeIcon" class="mr-2" text severity="secondary" (click)="toggleDarkMode()" />
    </ng-template>
</p-toolbar>

<!-- Main Section -->
<div class="flex" [style.backgroundColor]="mode === 'dark' ? 'var(--surface-900)' : 'var(--surface-100)'">
    <p-toast />

    <!-- Left hand side: Theme Editor -->
    <div class="flex flex-wrap gap-4" style="width: 50%; padding: 1rem;">
        <h2><i class="pi pi-palette"></i>&nbsp; Theme Lab</h2>

        <p-divider />

        <!-- Top: Select Presets or upload -->
        <div class="flex col-12 p-0 gap-4 justify-content-start">
            <div class="flex-1">
                <h4>Select a preset: </h4>
                <p-checkbox [binary]="true" />
                <p-checkbox [binary]="true" />
                <p-checkbox [binary]="true" />
                <p-checkbox [binary]="true" />
            </div>
            <div class="flex-1">
                <h4>Or upload an existing theme: </h4>
                <p-button icon="pi pi-upload" class="mr-2" text severity="secondary" (click)="fileInput.click()" />
                <input #fileInput type="file" accept=".ts" style="display: none;" (change)="handleFileInput($event)" />
            </div>
        </div>
        <p-divider />

        <!-- todo: add tabs for Colors, Borders, Components, etc. -->
         <!-- todo: left side should scroll independently of right side -->
        <!-- Bottom (left): Primitive color palettes -->
        <div class="flex-1">
            <h2><i class="pi pi-palette"></i>&nbsp;Primitive Color Palettes</h2>
            <div *ngFor="let palette of primitiveColors | keyvalue">
                <div class="palette-title">
                    <div class="color-swatch">
                        <p-colorpicker [ngModel]="palette.value['500']"
                            (onChange)="updatePalette(palette.key, $event, 'primitive')" />
                    </div>
                    <h4>{{ palette.key }}</h4>
                </div>
                <div class="palette" style="margin-bottom: 1rem; width: 100%;">
                    <div *ngFor="let shade of palette.value | keyvalue : sortPaletteKeys" class="color-swatch"
                        pTooltip="{{palette.key}} {{shade.key}}" tooltipPosition="top">
                        <p-colorpicker [(ngModel)]="shade.value"
                            (onChange)="updateSwatch(palette.key, shade.key, shade.value, 'primitive')" />

                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom (right): Semantic color palettes -->
        <div class="flex-1">
            <h2><i class="pi pi-palette"></i>&nbsp;Semantic Color Palettes</h2>
            <div *ngFor="let palette of semanticColors | keyvalue">
                <div class="palette-title">
                    <div class="color-swatch">
                        <p-colorpicker [ngModel]="palette.value['500']"
                            (onChange)="updatePalette(palette.key, $event, 'semantic')" />
                    </div>
                    <h4>{{ palette.key }}</h4>
                </div>
                <div class="palette" style="margin-bottom: 1rem; width: 100%;">
                    <div *ngFor="let shade of palette.value | keyvalue : sortPaletteKeys" class="color-swatch"
                        pTooltip="{{palette.key}} {{shade.key}}" tooltipPosition="top">
                        <p-colorpicker [(ngModel)]="shade.value"
                            (onChange)="updateSwatch(palette.key, shade.key, shade.value, 'semantic')" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Right hand side: PrimeNG Components Display -->
     <!-- todo: allow toggling with component-board instead -->
    <div style="width: 50%; padding: 1rem;">
        <app-primeng></app-primeng>
    </div>
</div>
